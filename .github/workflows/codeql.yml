name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Kotlin and Java
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        env:
          REPOSITORY: ${{ github.repository }}
          REF_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/$REPOSITORY.git"
          git fetch --depth=1 origin "$REF_SHA"
          git checkout --detach FETCH_HEAD
          git config --global --add safe.directory "$PWD"

      - name: Select JDK 17
        run: |
          if [ -n "${JAVA_HOME_17_X64:-}" ]; then
            echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
            echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          fi
          java -version

      - name: Validate Kotlin and Java analysis build
        run: ./gradlew --no-daemon --no-build-cache clean compileDebugKotlin compileDebugJavaWithJavac
